[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compex"
version = "0.1.0"
description = "Computational Expressionism engine — deterministic music generation from equation notation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Lee" }]
dependencies = ["numpy>=1.24"]

[project.scripts]
compex = "compex.cli:main"
compex-ui = "compex.ui.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compex = ["ui/*.html", "ui/*.css", "ui/*.js"]
